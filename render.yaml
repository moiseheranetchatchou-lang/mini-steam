# render.yaml — Render deployment config
# Place this at the ROOT of your repository.

services:
  - type: web
    name: ministeam-backend
    runtime: python
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate"
    startCommand: "gunicorn ministeam.wsgi:application"
    envVars:
      - key: SECRET_KEY
        generateValue: true          # Render auto-generates a secret key
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "ministeam-backend.onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://your-app.vercel.app"    # Update after Vercel deploy
      - key: DATABASE_URL
        fromDatabase:
          name: ministeam-db
          property: connectionString

databases:
  - name: ministeam-db
    databaseName: ministeam
    user: ministeam
